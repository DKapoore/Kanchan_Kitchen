<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="icon" href="favicon-48.png" sizes="48x48"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#C73E0A"><title>Admin Portal</title>
<script src="config.js" onerror="void 0"></script>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#C73E0A;--secondary:#f4a259;--background:#FFF7EC;--surface:#fff;--text:#2a1f1b;--muted:#6b5f5a;--border:#eadfd9;--success:#1f7a45;--warning:#946200;--danger:#b42318;--radius:14px;--shadow:0 2px 10px #2a1f1b14}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Karla,system-ui,sans-serif;background:var(--background);color:var(--text)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;min-height:42px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;margin:2px;transition:transform .1s}button:active{transform:scale(.97)}
button.g{background:var(--surface);color:var(--primary);border:1px solid var(--primary)}button.r{background:var(--danger)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2b6cb0;outline-offset:1px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font:inherit;margin:3px 0 8px;background:#fff;color:var(--text)}label{font-size:13px;color:var(--muted);font-weight:600}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.lc{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:26px;width:100%;max-width:380px;text-align:center}
.lc img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--border)}.lc h1{margin:8px 0 0;font-size:22px}.lc small{color:var(--muted)}.lc .f{text-align:left;margin-top:16px}.pw{position:relative}.pw button{position:absolute;right:2px;top:3px;background:none;color:var(--muted);min-height:36px;border:0}
#err{color:var(--danger);min-height:20px;font-size:14px}
header{background:var(--surface);padding:10px 12px;position:sticky;top:0;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;z-index:5}header b{flex:1}
#dw{display:none;position:fixed;top:0;bottom:0;left:0;width:260px;background:var(--surface);z-index:12;transform:translateX(-100%);transition:transform .2s;padding:14px 10px;overflow:auto;box-shadow:var(--shadow)}#dw.open{transform:none}
#dw .br{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}#dw .br img{width:38px;height:38px;border-radius:50%;object-fit:cover}
#dw button[data-t]{display:block;width:100%;text-align:left;background:none;color:var(--text);margin:0;border-radius:10px;padding:12px}#dw button.on{background:#C73E0A18;color:var(--primary)}
#ov{position:fixed;inset:0;background:#0006;z-index:11;display:none}#ov.open{display:block}
.wrap{padding:12px;max-width:900px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);color:var(--muted)}.stat b{font-size:24px;display:block;color:var(--text)}
.o{background:var(--surface);border-radius:var(--radius);padding:12px;margin:10px 0;box-shadow:var(--shadow)}.row{display:flex;gap:10px;align-items:center}.row img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--border);flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;background:#eee;margin:2px 3px 2px 0}.tag.w{background:#fff0c2;color:var(--warning)}.tag.ok{background:#d6f5df;color:var(--success)}.tag.bad{background:#fbd5d5;color:var(--danger)}
.det{display:none;border-top:1px solid var(--border);margin-top:8px;padding-top:8px}.o.open .det{display:block}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:24px;display:none;z-index:30}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20}.modal.open{display:flex}.modal>div{background:var(--surface);border-radius:18px;padding:16px;width:94%;max-width:520px;max-height:90vh;overflow:auto}
img[src=""]{display:none}img.rc{max-width:100%;border-radius:10px}.pv{border:1px dashed var(--border);border-radius:12px;padding:8px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.pv img{width:80px;height:60px;object-fit:cover;border-radius:8px;background:var(--border)}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(min-width:900px){#dw{transform:none;box-shadow:none;border-right:1px solid var(--border)}#hb,#ov{display:none!important}#app{margin-left:260px}.cards{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="login"><div class="lc"><img id="llogo" alt="Kitchen logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><h1 id="lname">Kitchen</h1><small>Admin Portal</small>
<div class="f"><label for="u">Username</label><input id="u" autocomplete="username"><label for="k">Password</label><div class="pw"><input id="k" type="password" autocomplete="current-password"><button type="button" id="eye" aria-label="Show password">Show</button></div>
<label><input type="checkbox" id="rm" style="width:auto"> Remember me on this device</label><p id="err" role="alert"></p><button id="lg" style="width:100%">Login</button>
<p style="margin:10px 0 0"><a href="#" id="fp">Forgot password?</a></p>
<div id="rst" style="display:none;margin-top:8px"><p style="margin:4px 0"><b>Reset Password</b><br><small>Choose recovery method</small></p><button type="button" class="g" id="sotp" style="width:100%;display:none">📧 Email OTP</button><button type="button" class="g" id="smob" style="width:100%;display:none">📱 Mobile OTP (SMS)</button>
<div id="rst2" style="display:none"><label for="otp">OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code"><label for="np">New password (min 10 characters)</label><input id="np" type="password" autocomplete="new-password"><label for="np2r">Repeat new password</label><input id="np2r" type="password" autocomplete="new-password"><button type="button" id="vrst" style="width:100%">Reset password</button></div>
<div id="rstm" style="display:none"><label for="motp">Mobile OTP (SMS)</label><input id="motp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button type="button" id="vmo" style="width:100%">Verify OTP</button><div id="rstm2" style="display:none"><label for="mnp">New password (min 10 characters)</label><input id="mnp" type="password" autocomplete="new-password"><label for="mnp2">Repeat new password</label><input id="mnp2" type="password" autocomplete="new-password"><button type="button" id="mrst" style="width:100%">Reset password</button></div></div></div></div></div></div>
<div id="app" style="display:none"><header><button class="g" id="hb" aria-label="Open menu">☰</button><b id="ttl">Dashboard</b><button class="g" id="rf">Refresh</button></header><div class="wrap" id="v"></div></div>
<div id="ov"></div>
<aside id="dw" aria-label="Menu"><div class="br"><img id="dlogo" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><b id="dname">Admin</b></div>
<button data-t="dash">Dashboard</button><button data-t="orders">Orders</button><button data-t="DISHES">Dishes</button><button data-t="OFFERS">Offers</button><button data-t="BANNERS">Banners</button><button data-t="DELIVERY_AREAS">Delivery Areas</button><button data-t="KITCHEN">Kitchen Status</button><button data-t="REVIEWS">Reviews</button><button data-t="FAQ">FAQ</button><button data-t="CUSTOMERS">Customers</button><button data-t="MSG">Messages</button><button data-t="TRACK">Tracking</button><button data-t="SET">Settings</button><button data-t="ADV">Advanced (SEO · GEO · AEO)</button><button data-t="SEC">Security</button><button data-t="GUIDE">Image Size Guide</button><button data-t="OUT">Logout</button></aside>
<div class="modal" id="m"><div id="mb"></div></div><div id="toast" role="status"></div>
<script>
var PUBX={};var st=localStorage.getItem('ak')?localStorage:sessionStorage,KEY=st.getItem('ak')||'',D=null,tab='dash',filter='All',PUB=null,$=function(i){return document.getElementById(i)};
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},3500)}
function rawApi(fn,args){
  if(window.KITCHEN_API)return fetch(window.KITCHEN_API,{method:'POST',body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json()}).catch(function(){return {success:false,message:'Network problem. Try again.'}});
  return new Promise(function(res){google.script.run.withSuccessHandler(res).withFailureHandler(function(){res({success:false,message:'Server error. Try again.'})})[fn].apply(null,args)})}
function api(a,p){return rawApi('adminApi',[KEY,a,p||{}])}
rawApi('getPublicData',[]).then(function(r){if(!r.success)return;PUB=r.data.settings;PUBX=r.data.extras||{};$('lname').textContent=$('dname').textContent=PUB['Kitchen Name'];if(PUB['Logo URL'])$('llogo').src=$('dlogo').src=PUB['Logo URL']});
var rtok='';
$('fp').onclick=function(e){e.preventDefault();var open=$('rst').style.display==='block';$('rst').style.display=open?'none':'block';if(open)return;
  rawApi('adminRecoveryMethods',[]).then(function(r){var mt=r.success?r.data:{};$('sotp').style.display=mt.email?'block':'none';$('smob').style.display=mt.mobile?'block':'none';$('err').textContent=(!mt.email&&!mt.mobile)?'No recovery method is set up. Save an Admin Email in Settings, or verify a recovery mobile in Security.':''})};
$('smob').onclick=async function(){var u=$('u').value.trim();if(!u){$('err').textContent='Enter your username first.';return}var r=await rawApi('adminResetMobileRequest',[u]);$('err').textContent=r.message+(r.success&&r.data&&r.data.masked?' ('+r.data.masked+')':'');if(r.success){$('rstm').style.display='block';$('rst2').style.display='none'}};
$('vmo').onclick=async function(){var r=await rawApi('adminResetMobileVerify',[$('motp').value.trim()]);$('err').textContent=r.message;if(r.success){rtok=r.data.token;$('rstm2').style.display='block'}};
$('mrst').onclick=async function(){if($('mnp').value!==$('mnp2').value){$('err').textContent='Passwords do not match.';return}var r=await rawApi('adminResetPassword',[rtok,$('mnp').value]);$('err').textContent=r.message;if(r.success){rtok='';$('rst').style.display='none';$('rstm').style.display='none';$('rstm2').style.display='none';$('k').value='';['motp','mnp','mnp2'].forEach(function(i){$(i).value=''})}};
$('sotp').onclick=async function(){$('rstm').style.display='none';var u=$('u').value.trim();if(!u){$('err').textContent='Enter your username first.';return}var r=await rawApi('adminResetRequest',[u]);$('err').textContent=r.message+(r.success&&r.data&&r.data.masked?' ('+r.data.masked+')':'');if(r.success)$('rst2').style.display='block'};
$('vrst').onclick=async function(){if($('np').value!==$('np2r').value){$('err').textContent='Passwords do not match.';return}var r=await rawApi('adminResetVerify',[$('otp').value.trim(),$('np').value]);$('err').textContent=r.message;if(r.success){$('rst').style.display='none';$('k').value='';$('otp').value='';$('np').value='';$('np2r').value=''}};
$('eye').onclick=function(){var k=$('k');k.type=k.type==='password'?'text':'password';this.textContent=k.type==='password'?'Show':'Hide'};
$('k').onkeydown=$('u').onkeydown=function(e){if(e.key==='Enter')$('lg').click()};
$('lg').onclick=function(){var b=this,u=$('u').value.trim();if(!u){$('err').textContent='Enter your username.';return}KEY=u+'|'+$('k').value;$('err').textContent='';b.disabled=true;b.textContent='Signing in...';
  api('login').then(function(r){b.disabled=false;b.textContent='Login';if(!r.success){$('err').textContent=r.code==='CONFIG'?r.message:'Wrong username or password.';return}
    st=$('rm').checked?localStorage:sessionStorage;st.setItem('ak',KEY);start()})};
function start(){$('dw').style.display='block';$('login').style.display='none';$('app').style.display='block';load()}
if(KEY)api('login').then(function(r){if(r.success)start();else{localStorage.removeItem('ak');sessionStorage.removeItem('ak')}});
function dw(o){$('dw').classList.toggle('open',o);$('ov').classList.toggle('open',o)}
$('hb').onclick=function(){dw(true)};$('ov').onclick=function(){dw(false)};
document.querySelectorAll('#dw button[data-t]').forEach(function(b){b.onclick=function(){dw(false);if(b.dataset.t==='OUT'){localStorage.removeItem('ak');sessionStorage.removeItem('ak');location.reload();return}
  tab=b.dataset.t;if(tab==='TRACK'){tab='orders';filter='Out for Delivery'}draw()}});
$('rf').onclick=load;
async function load(){var r=await api('orders');if(!r.success)return toast(r.message);D=r.data;draw()}
function draw(){document.querySelectorAll('#dw button[data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});$('ttl').textContent={dash:'Dashboard',orders:'Orders',MSG:'Messages',SET:'Settings',DELIVERY_AREAS:'Delivery Areas',KITCHEN:'Kitchen Status',REVIEWS:'Reviews',FAQ:'FAQ',ADV:'Advanced (SEO · GEO · AEO)',SEC:'Security',GUIDE:'Image Size Guide'}[tab]||tab[0]+tab.slice(1).toLowerCase();
  if(tab==='dash')dash();else if(tab==='orders')orders();else if(tab==='MSG')msgTab();else if(tab==='SET')settings();else if(tab==='KITCHEN')kitchen();else if(tab==='ADV')advanced();else if(tab==='SEC')security();else if(tab==='GUIDE')guide();else if(tab==='CUSTOMERS')customers();else crud(tab)}
function kcard(){var k=D.ks||{},open=k.open;return (D.warnSms?'<div class="o" style="border-left:4px solid var(--danger)">⚠️ Mobile verification is set to REQUIRED but the SMS gateway (TextBee) is not configured, so it is not being enforced.</div>':'')+(D.warnGps?'<div class="o" style="border-left:4px solid var(--danger)">⚠️ Delivery GPS settings are incomplete. Configure Kitchen Location and Delivery Radius before accepting GPS-validated orders.</div>':'')+'<div class="o" style="border-left:5px solid '+(open?'var(--success)':'var(--danger)')+'"><b>KITCHEN STATUS: '+(open?'🟢 OPEN':'🔴 CLOSED')+'</b><br>'+(open?'Today: '+esc(k.hoursToday):'Reason: '+esc(k.reason||''))+'<br>'+(open?'<button class="r" onclick="kop(\'closeToday\')">Close for Today</button>':'<button onclick="kop(\'open\')">Open Kitchen</button>')+'</div>'}
async function kop(op,reason){if(op==='closeToday'&&!confirm('Are you sure you want to stop accepting new orders for today?'))return;var r=await api('kitchenOp',{op:op,reason:reason||''});toast(r.message);if(r.success){await load();if(tab==='KITCHEN')kitchen()}}
function dash(){var s=D.stats,c=[['New Orders',s['New Order']],['Payment Pending',s.pending],['Confirmed',s.Confirmed],['Preparing',s.Preparing],['Ready',s.Ready],['Out for Delivery',s['Out for Delivery']],['Delivered',s.Delivered],["Today's Orders",s.todayOrders],["Today's Revenue",'₹'+s.todaySales]];
  $('v').innerHTML=kcard()+'<div class="cards">'+c.map(function(x){return '<div class="stat"><b>'+esc(x[1]||0)+'</b>'+x[0]+'</div>'}).join('')+'</div>'}
function orders(){var f=['All','Awaiting Approval','Awaiting Delivery Charge','Payment Verification Pending','Balance Due','Confirmed','Preparing','Ready','Out for Delivery','Delivered','Cancelled'];
  var l=D.orders.filter(function(o){return filter==='All'||o['Payment Status']===filter||o['Order Status']===filter});
  $('v').innerHTML='<label for="flt">Filter</label><select id="flt">'+f.map(function(x){return '<option'+(x===filter?' selected':'')+'>'+x+'</option>'}).join('')+'</select>'+(l.length?l.map(card).join(''):'<div class="empty">No orders here.</div>');
  $('flt').onchange=function(){filter=this.value;orders()}}
function card(o){var ps=o['Payment Status'],cl=ps==='Payment Confirmed'?'ok':ps==='Payment Rejected'?'bad':'w',id=esc(o['Order ID']);
  return '<div class="o"><div onclick="this.parentNode.classList.toggle(\'open\')" style="cursor:pointer"><b>'+id+'</b> · ₹'+esc(o['Final Amount'])+'<br>'+esc(o['Customer Name'])+' — '+esc(o['Dish'])+(String(o['Dish']).indexOf('×')>=0?'':' × '+esc(o['Quantity']))+'<br><span class="tag '+cl+'">'+esc(ps)+'</span><span class="tag">'+esc(o['Order Status'])+'</span><small>'+esc(o['Order Date'])+' '+esc(o['Order Time'])+'</small></div>'+
  '<div class="det"><p>📞 Mobile / WhatsApp: <b>+91 '+esc(o['Mobile'])+'</b>'+(o['Mobile Verified']===true?' <span class="tag ok">✓ OTP verified</span>':'')+'<br>🛒 '+itemsHtml(o)+'<br>📍 '+esc(o['Address'])+', '+esc(o['Area'])+' ('+esc(o['Landmark'])+')<br>📝 '+esc(o['Customer Note'])+'<br>Subtotal ₹'+esc(o['Original Price']-o['Discount'])+' · Delivery ₹'+esc(o['Delivery'])+' · <b>Total ₹'+esc(o['Final Amount'])+'</b> · Paid ₹'+esc(o['Amount Paid']||0)+'<br>UPI Transaction / Reference No.: <b>'+esc(o['UPI Txn ID'])+'</b><br>🚚 '+esc(o['Delivery City'])+' · '+esc(o['Delivery Area'])+gpsLine(o)+'</p>'+
  (o['Receipt URL']?'<button class="g" onclick="showRc(\''+id+'\')">View receipt</button> ':'')+'<button onclick="act(\'confirmPayment\',\''+id+'\')">Confirm Payment</button><button class="r" onclick="rej(\''+id+'\')">Reject Payment</button><br>'+
  ['Preparing','Ready','Out for Delivery','Delivered','Cancelled'].map(function(s){return '<button class="g" onclick="act(\'setStatus\',\''+id+'\',\''+s+'\')">'+(s==='Cancelled'?'Cancel':'Mark '+s)+'</button>'}).join('')+
  (ps==='Awaiting Approval'?'<div class="note" style="background:#fff0c2;padding:8px;border-radius:10px">Customer is OUTSIDE the delivery radius and asks for approval. Enter a delivery charge below (optional) and approve.<br><button onclick="appr(\''+id+'\',true)">Approve</button><button class="r" onclick="appr(\''+id+'\',false)">Decline</button></div>':'')+'<label for="dl'+id+'">Delivery charge ₹ (added after checking address)</label><input id="dl'+id+'" type="number" min="0" value="'+esc(o['Delivery'])+'"><button class="g" onclick="dlv(\''+id+'\')">Update Delivery</button>'+
  '<label for="t'+id+'">Tracking link (courier URL)</label><input id="t'+id+'" value="'+esc(o['Tracking Link'])+'" placeholder="https://..."><button class="g" onclick="track(\''+id+'\')">Add Tracking Link</button> <button onclick="msg(\''+id+'\')">WhatsApp / Message</button> <button '+(isConfirmed(o)?'':'class="g" ')+'onclick="openDone(\''+id+'\')">📦 Delivery details &amp; Invoice</button>'+(o['Tracking Link']?' <a href="'+esc(o['Tracking Link'])+'" target="_blank" rel="noopener">Track Delivery</a>':'')+'</div></div>'}
function gpsLine(o){if(o['GPS Status']==='VALID'){var ok=o['Customer Lat']!==''&&o['Customer Lat']!=null;return '<br>📍 GPS Verified · Distance: '+esc(o['Distance KM'])+' KM · Allowed Radius: '+esc(o['Radius KM'])+' KM · Accuracy '+esc(o['GPS Accuracy'])+' m'+(ok?' <a href="https://www.google.com/maps?q='+encodeURIComponent(o['Customer Lat']+','+o['Customer Lng'])+'" target="_blank" rel="noopener"><button type="button" class="g">Open Location in Maps</button></a>':' (coordinates removed after retention period)')}return '<br>📍 GPS: '+esc(o['GPS Status']||'Not checked')}
function itemsHtml(o){try{var a=JSON.parse(o['Items']);if(Array.isArray(a)&&a.length)return a.map(function(i){return esc(i.name)+' × '+esc(i.qty)}).join('<br>&nbsp;&nbsp;&nbsp;&nbsp;')}catch(e){}return esc(o['Dish'])+' × '+esc(o['Quantity'])}
function find(id){return D.orders.filter(function(o){return o['Order ID']===id})[0]}
async function act(a,id,v){var r=await api(a,{orderId:id,value:v});toast(r.message);if(r.success){await load();if(a==='confirmPayment')openDone(id)}}
async function appr(id,yes){if(!yes&&!confirm('Decline this delivery request? The order will be cancelled.'))return;var v=$('dl'+id)?$('dl'+id).value:'';var r=await api(yes?'approve':'decline',{orderId:id,value:v==='0'?'':v});toast(r.message);if(r.success)load()}
async function rej(id){var n=prompt('Reason (optional)');if(n===null)return;var r=await api('rejectPayment',{orderId:id,note:n});toast(r.message);if(r.success)load()}
async function dlv(id){var r=await api('setDelivery',{orderId:id,value:$('dl'+id).value});toast(r.message);if(r.success){await load();msg(id,'Delivery Charge Update')}}
async function track(id){var v=$('t'+id).value.trim(),r=await api('setTracking',{orderId:id,value:v});toast(r.message);if(r.success){find(id)['Tracking Link']=v;msg(id,'Tracking Available')}}
async function showRc(id){$('mb').innerHTML='Loading…';$('m').classList.add('open');var r=await api('receipt',{orderId:id});
  if(!r.success){$('mb').innerHTML=esc(r.message)+'<br><button onclick="cm()">Close</button>';return}var d=r.data;
  $('mb').innerHTML=(d.mime==='application/pdf'?'<p>PDF receipt — open it in Drive.</p>':'<img class="rc" alt="Payment receipt" src="data:'+d.mime+';base64,'+d.data+'">')+'<p><a href="'+esc(d.url)+'" target="_blank" rel="noopener">Open in Drive</a></p><button class="g" onclick="cm()">Close</button>'}
function cm(){$('m').classList.remove('open')}
var KN=function(){return D.kitchen};
function subst(t,o){var b=Math.max(0,(+o['Final Amount'])-(+o['Amount Paid']||0));return String(t).replace(/\{(\w+)\}/g,function(m,k){var M={CUSTOMER_NAME:o['Customer Name'],ORDER_ID:o['Order ID'],KITCHEN_NAME:KN(),DISH_NAME:o['Dish'],QUANTITY:o['Quantity'],AMOUNT:o['Final Amount'],TRACKING_LINK:o['Tracking Link']||'(add tracking link)',DELIVERY:o['Delivery'],BALANCE:b};return M[k]==null?m:M[k]})}

  '<div class="c0">'+(d.logo?'<img src="'+e(d.logo)+'" alt=""><br>':'')+'<h1>'+e(d.kitchen)+'</h1>'+(d.tag?'<div class="m">'+e(d.tag)+'</div>':'')+(d.addr?'<div class="m">'+e(d.addr)+'</div>':'')+(d.phone?'<div class="m">Ph: '+e(d.phone)+'</div>':'')+'</div><div class="d"></div><div class="c0 b" style="font-size:'+(fs+3)+'px;letter-spacing:2px">INVOICE</div><div class="d"></div>'+
  '<div class="kv"><span>Invoice No.</span><b>'+e(d.id)+'</b></div><div class="kv"><span>Date</span><b>'+e(d.date+' '+d.time)+'</b></div><div class="d"></div><div class="m">BILLED TO</div><div class="b">'+e(d.name)+'</div><div>+91 '+e(d.mobile)+'</div><div class="m">'+e(d.addrC)+'</div><br>'+
  '<table><tr><th>ITEM</th><th class="c">QTY</th><th class="r">RATE</th><th class="r">AMT</th></tr>'+rows+'</table><div style="margin-top:6px"><div class="kv"><span>Subtotal</span><span>'+e(fmtMoney(d.sub,d.cur))+'</span></div>'+(d.disc>0?'<div class="kv"><span>Discount</span><span>- '+e(fmtMoney(d.disc,d.cur))+'</span></div>':'')+'<div class="kv"><span>Delivery</span><span>'+(d.del>0?e(fmtMoney(d.del,d.cur)):'Free')+'</span></div></div>'+
  '<div class="tot"><span>TOTAL</span><span>'+e(fmtMoney(d.total,d.cur))+'</span></div><div class="paid">'+(d.paid?'*** PAID ***':e((d.ps||'PAYMENT PENDING').toUpperCase()))+'</div>'+(d.ref?'<div class="c0 m">UPI Ref: '+e(d.ref)+'</div>':'')+'<div class="d"></div><div class="c0 b">'+e(d.foot)+'</div><div class="c0 m">'+(d.fssai?'FSSAI Lic. No.: '+e(d.fssai)+'<br>':'')+(d.gstin?'GSTIN: '+e(d.gstin):'This is a simple order receipt.')+'</div><div style="height:8mm"></div></body></html>');
  w.document.close();setTimeout(function(){try{w.focus();w.print()}catch(x){}},700)}
async function openDone(id){var o=find(id);if(!o)return;var ok=isConfirmed(o),dis=ok?'':' disabled',invBlob=null,fname='Invoice-'+id+'.jpg';
  $('mb').innerHTML='<h3>Order '+esc(id)+'</h3>'+(ok?'<p style="color:var(--success);font-weight:700">✓ Order confirmed</p>':'<p class="note" style="background:#fff0c2;padding:8px;border-radius:10px">Copy and invoice buttons unlock after the payment is confirmed.</p>')+
  '<div class="o" style="box-shadow:none;border:1px solid var(--border)"><b>Delivery details (for another delivery app)</b><pre id="dtx" style="white-space:pre-wrap;margin:6px 0;font:14px/1.5 Karla,sans-serif;word-break:break-word">'+esc(detailsText(o))+'</pre><button id="cpa"'+dis+'>Copy details</button><button class="g" id="cpp"'+dis+'>Copy plain lines</button><br><button class="g" data-cp="name"'+dis+'>Name</button><button class="g" data-cp="mobile"'+dis+'>Mobile</button><button class="g" data-cp="address"'+dis+'>Address</button><button class="g" data-cp="gps"'+dis+'>GPS</button></div>'+
  '<div class="o" style="box-shadow:none;border:1px solid var(--border)"><b>Invoice</b> <small>(sent to +91 '+esc(String(o['Mobile']).slice(-10))+')</small><br><img id="invp" alt="Invoice preview" style="max-width:100%;max-height:320px;border:1px solid var(--border);border-radius:8px;margin:6px 0;display:none"><div id="invs" class="note" style="padding:8px;border-radius:10px">Preparing invoice…</div><button id="invw"'+dis+'>Send invoice on WhatsApp</button><button class="g" id="invd"'+dis+'>Download JPEG</button><br><button class="g" id="inv80"'+dis+'>🖨 Print 80 mm</button><button class="g" id="inv58"'+dis+'>🖨 Print 58 mm</button><button class="g" id="invt"'+dis+'>Thermal JPEG 80 mm</button><button class="g" id="invt58"'+dis+'>Thermal JPEG 58 mm</button></div><button class="g" onclick="cm()">Close</button>';
  $('m').classList.add('open');
  var dl=detailLines(o);$('cpa').onclick=function(){copyText(detailsText(o),'Details copied (4 lines)')};$('cpp').onclick=function(){copyText(detailsPlain(o),'Plain lines copied')};
  [].forEach.call(document.querySelectorAll('#mb [data-cp]'),function(b){b.onclick=function(){copyText(dl[b.getAttribute('data-cp')],b.textContent+' copied')}});
  $('inv80').onclick=function(){printInvoice(o,80)};$('inv58').onclick=function(){printInvoice(o,58)};
  $('invt').onclick=async function(){var cv=await drawInvoice(invData(o),576,true);dlBlob(await canvasBlob(cv,.95),'Thermal-'+fname);toast('Thermal image saved (576 px = 80 mm)')};
  $('invt58').onclick=async function(){var cv=await drawInvoice(invData(o),384,true);dlBlob(await canvasBlob(cv,.95),'Thermal58-'+fname);toast('Thermal image saved (384 px = 58 mm)')};
  try{var cv=await drawInvoice(invData(o),720,false);invBlob=await canvasBlob(cv,.92);var im=$('invp');if(im){im.src=URL.createObjectURL(invBlob);im.style.display='block'}$('invs').textContent='Ready. WhatsApp: pick the chat of +91 '+String(o['Mobile']).slice(-10)+' after tapping Send.'}catch(e){$('invs').textContent='Could not create the invoice image.'}
  $('invd').onclick=function(){if(invBlob)dlBlob(invBlob,fname)};
  $('invw').onclick=async function(){if(!invBlob)return toast('Invoice is not ready yet.');var f=null,txt=waInvoiceText(o);try{f=new File([invBlob],fname,{type:'image/jpeg'})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:txt,title:'Invoice '+id});return}catch(e){if(e&&e.name==='AbortError')return}}
    dlBlob(invBlob,fname);window.open('https://wa.me/'+waNum(o)+'?text='+encodeURIComponent(txt),'_blank');toast('Invoice saved. Attach it in the WhatsApp chat that just opened.')}}
</script></body></html>
